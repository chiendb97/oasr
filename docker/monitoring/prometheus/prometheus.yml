# Prometheus scrape configuration for OASR.
#
# Keep `scrape_interval` aligned with the Grafana datasource `timeInterval` or
# rate windows may be shorter than the scrape period.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Set per deployment; the dashboard does not use it, but a fleet-wide
    # Prometheus needs to tell two OASR clusters apart.
    cluster: local

scrape_configs:
  - job_name: oasr
    metrics_path: /metrics

    # Compose renders OASR_TARGETS into this watched file because Prometheus does
    # not expand target environment variables. The refresh interval covers bind
    # mounts that do not propagate file-watch events.
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s

    # Keep Prometheus's address-derived `instance` label so replicas stay distinct.

    # Keep scrape timeout below the interval to prevent overlapping probes.
    scrape_timeout: 10s
