[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "cmake>=3.18",
    "pybind11>=2.10",
    "ninja",
    "setuptools-rust>=1.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "oasr"
version = "0.1.0"
description = "Open Automatic Speech Recognition - High-performance ASR inference framework"
readme = "README.md"
license = {text = "Apache-2.0"}
# 3.10 is the real floor, not an aspiration: oasr/decoder/wfst/graph_image.py
# annotates defaults with PEP 604 unions (``np.ndarray | None``) and has no
# ``from __future__ import annotations``, so importing it on 3.9 raises
# TypeError at def time.  CI runs test-cpu on 3.10 so the claim stays tested.
requires-python = ">=3.10"
authors = [
    {name = "OASR Contributors"},
]
keywords = [
    "asr",
    "speech-recognition",
    "deep-learning",
    "cuda",
    "conformer",
    "paraformer",
    "transformer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.20.0",
    "apache-tvm-ffi>=0.1.0",
    "jinja2>=3.0",
    # Checkpoint converters parse WeNet train.yaml (was used undeclared).
    "PyYAML>=5.4",
]

[project.optional-dependencies]
audio = [
    "torchaudio>=0.11.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "kaldifeat>=1.22; python_version>='3.8'",
]
serving = [
    # Client libs: `oasr.client` / the `oasr` CLI (httpx for the REST routes,
    # websockets for /v1/realtime) and benchmarks/bench_service.py.  The server
    # itself is the Rust ``oasr-server`` binary (in-process PyO3 engine — no
    # msgpack / no pyzmq runtime dependency).
    "httpx>=0.27.0",
    "websockets>=12.0",
]
hub = [
    # HuggingFace Hub checkpoint download + native-format weights I/O.
    "huggingface_hub>=0.20.0",
    "safetensors>=0.4.0",
]
tokenizers = [
    # TokenizerSpec kinds beyond the built-in symbol_table.
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15.0",
]
attention = [
    # CuTeDSL, which compiles the fused-attention kernels under
    # oasr/kernels/cute/.  Genuinely optional: with it missing, the default
    # OASR_ATTN_BACKEND=auto logs a warning and oasr.fmha runs on PyTorch
    # SDPA, so `import oasr` and every non-attention kernel are unaffected.
    #
    # Floor is the oldest release the kernels resolve against (see
    # oasr/jit/attention.py::MIN_CUTEDSL_VERSION); 4.6.1 is what is tested.
    # 4.6.0 deleted cute.make_fragment and cute.core.ThrMma/ThrCopy, and
    # nothing here used them, so the whole range works.  Capped below 5 because
    # a major bump is where CuTeDSL removes long-deprecated APIs.
    #
    # NB: installing this pulls protobuf>=6.30 for the (unused, beta) IKET
    # profiler.  On an environment pinned to protobuf 4.x — e.g. one whose
    # grpcio-tools generates the _pb2 modules scripts/grpc_stream.py imports —
    # install it with --no-deps and let the DSL's own wheels resolve.
    "nvidia-cutlass-dsl>=4.5.2,<5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
wfst = [
    "k2>=1.24",
    "kaldilm",
]
all = [
    "oasr[audio,serving,hub,tokenizers,attention]",
]

[project.urls]
Homepage = "https://github.com/your-org/oasr"
Documentation = "https://oasr.readthedocs.io"
Repository = "https://github.com/your-org/oasr"
Issues = "https://github.com/your-org/oasr/issues"

[project.scripts]
# One command to learn: `oasr transcribe|translate|models|serve|convert`.
# `serve` and `convert` forward to the two entry points below, which stay for
# compatibility and for anyone scripting them directly.
oasr = "oasr.cli:main"
# Rust serving front-end.  `pip install` builds it into `oasr._core` (below);
# this wrapper forwards argv to it so `oasr-server` works like the old binary.
oasr-server = "oasr._server_cli:main"
# Materialize a WeNet / icefall checkpoint as the native OASR format
# (oasr_config.json + model.safetensors + tokenizer assets).
oasr-convert = "oasr.checkpoints.convert:main"

[tool.setuptools.packages.find]
include = ["oasr*"]

# Build the Rust serving core as the `oasr._core` PyO3 extension module during
# `pip install`, mirroring sglang's setuptools-rust integration.  The crate is
# a cdylib that links libpython at import time (pyo3 `extension-module`); see
# rust/crates/oasr-core.  Requires a Rust toolchain + protobuf-compiler at
# build time (tonic build.rs in oasr-server-grpc).
[[tool.setuptools-rust.ext-modules]]
target = "oasr._core"
path = "rust/crates/oasr-core/Cargo.toml"
binding = "PyO3"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | third_party
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", "third_party", "build", "dist"]
# isort and ruff's `I` rules both sort imports, and CI runs both — they have to
# agree or every run flips the file back.  These three settings are the ones
# where their defaults differ; keep them in lockstep with [tool.ruff.lint.isort].
known_first_party = ["oasr", "benchmarks"]
combine_as_imports = true
force_sort_within_sections = false

[tool.mypy]
# Deliberately no `python_version`: it applies to third-party *stubs* too, and
# pinning it below the interpreter makes mypy abort on any dependency whose
# stubs use newer syntax — numpy's `.pyi` uses PEP 695 `type` statements, so
# `python_version = "3.10"` died with "Type statement is only supported in
# Python 3.12 and greater" before checking a single line of this repo (and
# `"3.8"` died the same way on torch's match statements).  mypy therefore runs
# at the interpreter's version; CI pins that to 3.12.  Real 3.10 compatibility
# is covered by test-cpu.yml actually running the suite on 3.10.
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Type-checking third-party sources (torch in particular) is neither our job
# nor achievable — torch's own sources do not type-check cleanly, and mypy
# aborted the whole run on them before this was set.
follow_imports = "silent"
exclude = [
    "third_party",
    "build",
    "dist",
    # mypy (1.18 *and* 2.3) hits an INTERNAL ERROR on the `np.lexsort` call at
    # line 41 against numpy >= 2.5's stubs, which aborts the whole run — an
    # `ignore_errors` override is not enough because the crash happens during
    # checking.  Drop this entry once the upstream crash is fixed.
    "oasr/decoder/wfst/lattice.py",
]

# CuteDSL kernels are written against `cutlass.cute`, whose decorators rewrite
# the function bodies; mypy sees the DSL's injected names as undefined.  ~90%
# of the repo's `name-defined` errors came from here and none were real.
[[tool.mypy.overrides]]
module = "oasr.kernels.cute.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: long-running tests (skip with -m 'not slow')",
    "concurrent: multi-thread engine stress tests (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "third_party",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
    # B905 (`zip(..., strict=)`) only became reachable when target-version moved
    # to py310.  It is a real bug class — a short zip truncates silently — but
    # deciding strict=True per call site needs to know the lengths always match,
    # and there are 38 of them across the engine and the kernels.  Enabling it
    # is tracked as a follow-up; turning it on blind would be a guess, not a fix.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Package facades re-export their public surface; the imports are the point.
# `oasr/__init__.py` additionally interleaves imports with the lazy `_C` loader,
# so its E402s are structural.
"oasr/__init__.py" = ["F401", "E402"]
"oasr/**/__init__.py" = ["F401"]
# Benchmark entry points insert the repo root on sys.path before importing
# `benchmarks.*`; the routine modules import kernels for their registration
# side effect and re-export helpers the CLI resolves by name.
"benchmarks/*.py" = ["E402"]
"benchmarks/routines/*.py" = ["F401", "E402"]

# Mirror of [tool.isort] — see the note there.
[tool.ruff.lint.isort]
known-first-party = ["oasr", "benchmarks"]
combine-as-imports = true
force-sort-within-sections = false
