name: Bug report
description: Something produced a wrong transcript, crashed, hung, or did not match the documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Wrong output from a GPU kernel
        often depends on the GPU, the checkpoint and the batch shape, so those
        fields below matter most.

        For a security vulnerability, do **not** open an issue. See
        [SECURITY.md](https://github.com/chiendb97/oasr/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest command or script that shows the problem, for example an
        `oasr transcribe` invocation, an `oasr-server` command line plus the
        request you sent, or a short Python snippet.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Model architecture
      options:
        - conformer (WeNet U2/U2++)
        - zipformer (icefall CTC)
        - transducer (icefall RNN-T)
        - nemotron (FastConformer RNN-T)
        - whisper
        - paraformer (FunASR)
        - speech_llm (Qwen2-Audio)
        - Not model-specific (kernel, server, CLI, ...)
        - Not sure
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint
      description: Hugging Face repo id, release name or download link of the checkpoint you loaded.
      placeholder: openai/whisper-large-v3
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - Python engine (ASREngine)
        - oasr CLI
        - oasr-server HTTP (OpenAI-compatible /v1/audio/*)
        - oasr-server /v1/realtime WebSocket
        - oasr-server gRPC
        - Kernel / functional API (oasr.functionals, oasr.layers)
        - Checkpoint conversion (oasr-convert)
        - Quantization (oasr quantize)
        - Build / install
  - type: dropdown
    id: mode
    attributes:
      label: Service mode
      options:
        - offline
        - streaming
        - both
        - not applicable
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please include the output of:
        `git rev-parse HEAD`, `nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv`,
        `nvcc --version | tail -1`, `python -c "import torch; print(torch.__version__, torch.version.cuda)"`,
        and the dtype you ran in (fp16 / bf16 / fp32 / int8 / fp8).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Full error messages and tracebacks, or the wrong transcript next to the expected one.
      render: text
