name: test-gpu-modal

# Rented-runner counterpart to test-gpu.yml, and the only place OASR runs on an
# architecture nobody here owns.  It runs only when somebody presses "Run
# workflow" -- there is no schedule and no `pull_request` trigger, because every
# run is rented GPU-minutes.  `gpus=all` sweeps one accelerator per distinct SM
# (see `ARCH_SWEEP` in ci/modal_app.py); a dispatch can name any subset.  Set
# the Modal token secrets once.
#
# To test a PR, dispatch with `pr=<number>`: the job checks out that PR's head
# commit (pinned when the run starts, so a later push is not what gets tested)
# and reports the result back to the PR as the `test-gpu-modal` commit status.
# A PR from a fork is refused unless `allow_fork` is ticked: the runner holds
# the Modal token while it imports the checked-out ci/modal_app.py, so read a
# fork's diff before letting it run.
#
# Assets are NOT uploaded from this runner: `ci/modal_assets.py` names each one
# by (source, pinned revision) and `modal run ci/modal_app.py::fetch_assets`
# pulls them inside the container into a persistent Volume.  Run that once per
# Modal workspace; it is idempotent afterwards.  The four assets with no public
# source are listed in `modal_assets.NO_PUBLIC_SOURCE` and are reported as
# missing rather than silently skipped.

run-name: >-
  test-gpu-modal ${{ inputs.pr && format('PR #{0}', inputs.pr) || github.ref_name }}
  (${{ inputs.gpus }})

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test (empty = the branch selected above)"
        required: false
        default: ""
      allow_fork:
        description: "Allow a PR from a fork (its code runs next to the Modal token: review it first)"
        type: boolean
        required: false
        default: false
      gpus:
        description: "Comma-separated Modal accelerators, or 'all' for one per architecture"
        required: false
        default: "all"
      suites:
        description: "Comma-separated suite names (empty = all). See ci/gpu_suites.py --list"
        required: false
        default: ""
      checkpoints:
        description: "Run the checkpoint/audio tests (needs the Volume — see the header)"
        type: boolean
        required: false
        default: true
      strict:
        description: "Fail instead of skipping when an expected asset is missing"
        type: boolean
        required: false
        default: true

# Keyed on the PR when one is named: two PRs dispatched from the same branch
# would otherwise share `github.ref` and cancel each other.
concurrency:
  group: test-gpu-modal-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gpu:
    name: modal (${{ inputs.gpus || 'all' }})
    runs-on: ubuntu-latest
    # A full sweep is 5 architectures x 6 suites, all concurrent, plus an image
    # build on a cold cache.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      STATUS_CONTEXT: test-gpu-modal
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Resolve the PR to one commit before anything else, so the status lands
      # on the commit that was actually tested.
      - name: Resolve the PR head
        id: pr
        if: ${{ inputs.pr != '' }}
        env:
          ALLOW_FORK: ${{ inputs.allow_fork }}
        run: |
          case "$PR" in
            ''|*[!0-9]*) echo "::error::pr must be a PR number, got '$PR'"; exit 1 ;;
          esac
          read -r state cross sha < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository,headRefOid \
            --jq '"\(.state) \(.isCrossRepository) \(.headRefOid)"')
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR is $state"; exit 1
          fi
          if [ "$cross" = "true" ] && [ "$ALLOW_FORK" != "true" ]; then
            echo "::error::PR #$PR is from a fork; review it, then re-run with allow_fork"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Modal GPU suites running (${{ inputs.gpus }})" \
            -f target_url="$RUN_URL" > /dev/null

      # No `submodules:` here on purpose.  3rdparty/cutlass is 26 069 files and
      # 2.0 GiB, and the container fetches the pinned commit itself — the sha
      # comes from `git ls-tree HEAD 3rdparty/cutlass`, which reads the index
      # and so is right whether or not the submodule is checked out.
      - uses: actions/checkout@v4
        with:
          # The pinned PR head when one is named, else the dispatched branch.
          ref: ${{ steps.pr.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pytest as well as modal: `modal run` *imports* ci/modal_app.py here, on
      # the runner, to build the app graph, and that module derives the Volume
      # layout from tests/assets.py, which imports pytest for its skip site.  So
      # this box needs it even though it never runs a test — the container has
      # its own pinned copy.  Nothing else the module imports is outside stdlib.
      - name: Install the Modal client
        run: pip install modal pytest

      # ci/gpu_suites.py is the shared source of truth for the family split;
      # fail here rather than silently not running a new test file.
      - name: Check the suite split covers every test file
        run: python ci/gpu_suites.py --check

      # Idempotent: every asset already in the Volume costs one marker check.
      # Kept in the workflow rather than run by hand so a new source in
      # ci/modal_assets.py reaches CI without anybody remembering to.
      - name: Fetch the external assets into the Modal Volume
        if: ${{ inputs.checkpoints }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run ci/modal_app.py::fetch_assets

      - name: Run the GPU suites on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          strict_flag="--strict"
          if [ "${{ inputs.strict }}" = "false" ]; then
            strict_flag="--no-strict"
          fi
          assets_flag="--assets"
          if [ "${{ inputs.checkpoints }}" = "false" ]; then
            assets_flag="--no-assets"
          fi
          # `::main` is not optional: the file defines three local entrypoints,
          # and `modal run` on a file with more than one refuses to guess
          # ("Specify a Modal Function or local entrypoint to run").
          modal run ci/modal_app.py::main \
            --gpus "${{ inputs.gpus || 'all' }}" \
            --suites "${{ inputs.suites }}" \
            $strict_flag $assets_flag

      # `always()` so a failed or cancelled run does not leave the PR pending.
      - name: Report the result on the PR
        if: ${{ always() && steps.pr.outputs.sha != '' }}
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; desc="Modal GPU suites passed" ;;
            cancelled) state=error; desc="Modal GPU run cancelled" ;;
            *) state=failure; desc="Modal GPU suites failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$desc (${{ inputs.gpus }})" \
            -f target_url="$RUN_URL" > /dev/null
