name: test-gpu-modal

# Rented-runner counterpart to test-gpu.yml. Set Modal token secrets once.
# The default accelerator covers architecture-gated suites; alternate targets
# are supplemental. Seed assets with ci/modal_app.py::seed_assets, then dispatch
# with checkpoints enabled. Without them, strict mode reports all skipped assets.

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suite names (empty = all). See ci/gpu_suites.py --list"
        required: false
        default: ""
      gpu:
        description: "Modal accelerator (RTX-PRO-6000 is sm_120, matching the 5090)"
        required: false
        default: "RTX-PRO-6000"
      checkpoints:
        description: "Also run the checkpoint/audio tests (needs the seeded Volume — see the header)"
        type: boolean
        required: false
        default: false
      strict:
        description: "Fail instead of skipping when an expected asset is missing"
        type: boolean
        required: false
        default: true
  schedule:
    # 03:30 UTC Sundays — offset from the self-hosted nightly so a shared
    # failure is attributable to the code rather than to contention.
    - cron: "30 3 * * 0"

concurrency:
  group: test-gpu-modal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu:
    name: modal (${{ github.event.inputs.gpu || 'RTX-PRO-6000' }})
    runs-on: ubuntu-latest
    # 5 suites in parallel on a rented GPU, plus image build on a cold cache.
    timeout-minutes: 90
    steps:
      # CUTLASS lives in the 3rdparty/cutlass submodule and every GEMM / BMM /
      # Conv2D kernel is JIT-compiled against its headers, so a checkout without
      # it either fails to compile or -- worse, on a persistent runner -- picks
      # up whatever CUTLASS version was left in the workspace.  The pinned
      # commit is the one the JIT cache key stamps.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pytest as well as modal: `modal run` *imports* ci/modal_app.py here, on
      # the runner, to build the app graph, and that module derives the Volume
      # layout from tests/assets.py, which imports pytest for its skip site.  So
      # this box needs it even though it never runs a test — the container has
      # its own pinned copy.  Nothing else the module imports is outside stdlib.
      - name: Install the Modal client
        run: pip install modal pytest

      # ci/gpu_suites.py is the shared source of truth for the family split;
      # fail here rather than silently not running a new test file.
      - name: Check the suite split covers every test file
        run: python ci/gpu_suites.py --check

      - name: Run the GPU suite on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OASR_MODAL_GPU: ${{ github.event.inputs.gpu || 'RTX-PRO-6000' }}
        run: |
          strict_flag="--strict"
          if [ "${{ github.event.inputs.strict }}" = "false" ]; then
            strict_flag="--no-strict"
          fi
          # Off unless explicitly asked for: `github.event.inputs` is empty on
          # the schedule trigger, so the cron run is the no-checkpoint one until
          # the Volume is seeded and this default is flipped.
          assets_flag="--no-assets"
          if [ "${{ github.event.inputs.checkpoints }}" = "true" ]; then
            assets_flag="--assets"
          fi
          # `::main` is not optional: the file also defines the `seed_assets`
          # entrypoint, and `modal run` on a file with more than one refuses to
          # guess ("Specify a Modal Function or local entrypoint to run").
          modal run ci/modal_app.py::main \
            --suites "${{ github.event.inputs.suites }}" \
            $strict_flag $assets_flag
