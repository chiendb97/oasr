name: test-gpu-modal

# The same GPU suite as test-gpu.yml, on a rented Blackwell instead of the
# self-hosted box.  The job itself runs on a GitHub-hosted runner and only
# holds a Modal token — the GPU work happens in `ci/modal_app.py`, so a fork PR
# can never reach anyone's hardware.
#
# The default accelerator is RTX-PRO-6000: GB202 at compute capability 12.0,
# the same sm_120 as the RTX 5090 this project is tuned for.  Anything else is
# a different SM, which silently skips the SM120-gated suites — useful as a
# second target, wrong as the only one.
#
# ---------------------------------------------------------------------------
# Setup (once)
# ---------------------------------------------------------------------------
#   1. `pip install modal && modal token new`
#   2. Repo Settings -> Secrets -> Actions: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
#
# That is the whole of it.  The `checkpoints` input is **off** by default, and
# off this workflow needs no Volume, no upload and no external file: no asset
# env var is set, every checkpoint- and audio-gated test skips, and what runs is
# the coverage a bare GPU can produce — kernels, the layer waist, the JIT, the
# schedulers, decode plumbing on synthetic weights.  `--strict-assets` stays on
# either way; with checkpoints off the allow-list simply widens to every
# declared asset, so a run still reports what it did not cover.
#
# ---------------------------------------------------------------------------
# Setup (later, to also run the checkpoint-backed half)
# ---------------------------------------------------------------------------
#   3. Seed the checkpoints into the Volume, from a box that has them (~29 GiB,
#      dominated by Qwen2-Audio-7B at 16 GiB):
#        set -a; source .env; set +a
#        modal run ci/modal_app.py::seed_assets --dry-run   # check the plan
#        modal run ci/modal_app.py::seed_assets
#      `.env` is the whole configuration: seeding reads the same per-asset env
#      vars the suite gates on, and the slots come from `Asset.relpath` in
#      tests/assets.py, so adding a checkpoint there seeds it here with no edit
#      to ci/modal_app.py.  Re-running overwrites in place, so a single
#      refreshed asset is just another `seed_assets`.
#   4. Dispatch with `checkpoints: true` (and flip the default below once the
#      Volume is seeded, so the weekly run covers them too).
#
# Costs GPU-minutes per run, so this is dispatch + weekly rather than per-push.
# Point it at a PR by dispatching with the branch selected.

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suite names (empty = all). See ci/gpu_suites.py --list"
        required: false
        default: ""
      gpu:
        description: "Modal accelerator (RTX-PRO-6000 is sm_120, matching the 5090)"
        required: false
        default: "RTX-PRO-6000"
      checkpoints:
        description: "Also run the checkpoint/audio tests (needs the seeded Volume — see the header)"
        type: boolean
        required: false
        default: false
      strict:
        description: "Fail instead of skipping when an expected asset is missing"
        type: boolean
        required: false
        default: true
  schedule:
    # 03:30 UTC Sundays — offset from the self-hosted nightly so a shared
    # failure is attributable to the code rather than to contention.
    - cron: "30 3 * * 0"

concurrency:
  group: test-gpu-modal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu:
    name: modal (${{ github.event.inputs.gpu || 'RTX-PRO-6000' }})
    runs-on: ubuntu-latest
    # 5 suites in parallel on a rented GPU, plus image build on a cold cache.
    timeout-minutes: 90
    steps:
      # CUTLASS lives in the 3rdparty/cutlass submodule and every GEMM / BMM /
      # Conv2D kernel is JIT-compiled against its headers, so a checkout without
      # it either fails to compile or -- worse, on a persistent runner -- picks
      # up whatever CUTLASS version was left in the workspace.  The pinned
      # commit is the one the JIT cache key stamps.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Modal client
        run: pip install modal

      # ci/gpu_suites.py is the shared source of truth for the family split;
      # fail here rather than silently not running a new test file.
      - name: Check the suite split covers every test file
        run: python ci/gpu_suites.py --check

      - name: Run the GPU suite on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OASR_MODAL_GPU: ${{ github.event.inputs.gpu || 'RTX-PRO-6000' }}
        run: |
          strict_flag="--strict"
          if [ "${{ github.event.inputs.strict }}" = "false" ]; then
            strict_flag="--no-strict"
          fi
          # Off unless explicitly asked for: `github.event.inputs` is empty on
          # the schedule trigger, so the cron run is the no-checkpoint one until
          # the Volume is seeded and this default is flipped.
          assets_flag="--no-assets"
          if [ "${{ github.event.inputs.checkpoints }}" = "true" ]; then
            assets_flag="--assets"
          fi
          # `::main` is not optional: the file also defines the `seed_assets`
          # entrypoint, and `modal run` on a file with more than one refuses to
          # guess ("Specify a Modal Function or local entrypoint to run").
          modal run ci/modal_app.py::main \
            --suites "${{ github.event.inputs.suites }}" \
            $strict_flag $assets_flag
