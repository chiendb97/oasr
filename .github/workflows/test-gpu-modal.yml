name: test-gpu-modal

# Rented-runner counterpart to test-gpu.yml, and the only place OASR runs on an
# architecture nobody here owns.  The weekly run sweeps one accelerator per
# distinct SM (see `ARCH_SWEEP` in ci/modal_app.py); a dispatch can name any
# subset.  Set the Modal token secrets once.
#
# Assets are NOT uploaded from this runner: `ci/modal_assets.py` names each one
# by (source, pinned revision) and `modal run ci/modal_app.py::fetch_assets`
# pulls them inside the container into a persistent Volume.  Run that once per
# Modal workspace; it is idempotent afterwards.  The four assets with no public
# source are listed in `modal_assets.NO_PUBLIC_SOURCE` and are reported as
# missing rather than silently skipped.

on:
  workflow_dispatch:
    inputs:
      gpus:
        description: "Comma-separated Modal accelerators, or 'all' for one per architecture"
        required: false
        default: "all"
      suites:
        description: "Comma-separated suite names (empty = all). See ci/gpu_suites.py --list"
        required: false
        default: ""
      checkpoints:
        description: "Run the checkpoint/audio tests (needs the Volume — see the header)"
        type: boolean
        required: false
        default: true
      strict:
        description: "Fail instead of skipping when an expected asset is missing"
        type: boolean
        required: false
        default: true
  schedule:
    # 03:30 UTC Sundays — offset from the self-hosted nightly so a shared
    # failure is attributable to the code rather than to contention.
    - cron: "30 3 * * 0"

concurrency:
  group: test-gpu-modal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu:
    name: modal (${{ github.event.inputs.gpus || 'all' }})
    runs-on: ubuntu-latest
    # A full sweep is 5 architectures x 6 suites, all concurrent, plus an image
    # build on a cold cache.
    timeout-minutes: 150
    steps:
      # No `submodules:` here on purpose.  3rdparty/cutlass is 26 069 files and
      # 2.0 GiB, and the container fetches the pinned commit itself — the sha
      # comes from `git ls-tree HEAD 3rdparty/cutlass`, which reads the index
      # and so is right whether or not the submodule is checked out.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pytest as well as modal: `modal run` *imports* ci/modal_app.py here, on
      # the runner, to build the app graph, and that module derives the Volume
      # layout from tests/assets.py, which imports pytest for its skip site.  So
      # this box needs it even though it never runs a test — the container has
      # its own pinned copy.  Nothing else the module imports is outside stdlib.
      - name: Install the Modal client
        run: pip install modal pytest

      # ci/gpu_suites.py is the shared source of truth for the family split;
      # fail here rather than silently not running a new test file.
      - name: Check the suite split covers every test file
        run: python ci/gpu_suites.py --check

      # Idempotent: every asset already in the Volume costs one marker check.
      # Kept in the workflow rather than run by hand so a new source in
      # ci/modal_assets.py reaches CI without anybody remembering to.
      - name: Fetch the external assets into the Modal Volume
        if: ${{ github.event.inputs.checkpoints != 'false' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run ci/modal_app.py::fetch_assets

      - name: Run the GPU suites on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          strict_flag="--strict"
          if [ "${{ github.event.inputs.strict }}" = "false" ]; then
            strict_flag="--no-strict"
          fi
          # `github.event.inputs` is empty on the schedule trigger, so the cron
          # run takes the defaults: every architecture, with checkpoints.
          assets_flag="--assets"
          if [ "${{ github.event.inputs.checkpoints }}" = "false" ]; then
            assets_flag="--no-assets"
          fi
          # `::main` is not optional: the file defines three local entrypoints,
          # and `modal run` on a file with more than one refuses to guess
          # ("Specify a Modal Function or local entrypoint to run").
          modal run ci/modal_app.py::main \
            --gpus "${{ github.event.inputs.gpus || 'all' }}" \
            --suites "${{ github.event.inputs.suites }}" \
            $strict_flag $assets_flag
