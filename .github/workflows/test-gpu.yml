name: test-gpu

# Nightly self-hosted suite with strict checkpoint coverage.
# The runner needs the CUDA toolchain, a Rust toolchain with protoc on PATH,
# torch, and the assets declared in tests/assets.py; every job builds the
# extensions itself (see "Build the extensions"). Missing assets must be
# explicitly allow-listed below.
# SECURITY: never add a pull_request trigger; fork code must not reach this host.

on:
  schedule:
    # 02:30 UTC nightly.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "Extra args appended to every pytest invocation"
        required: false
        default: ""

concurrency:
  group: test-gpu
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Only non-checkpoint parity assets are allowed to be absent.
  STRICT: >-
    --strict-assets
    --allow-missing-asset WENET_REF_DIR
    --allow-missing-asset LANG_DIR

jobs:
  # The family split lives in ci/gpu_suites.py so the self-hosted matrix and the
  # Modal fan-out cannot drift apart.  This job just publishes it.
  matrix:
    name: resolve suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.build.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: build
        run: |
          python ci/gpu_suites.py --check
          echo "suites=$(python ci/gpu_suites.py --github-matrix)" >> "$GITHUB_OUTPUT"

  # Split by family so one failing area does not mask the rest, and so the box
  # dropping off the bus costs one suite instead of the sweep.
  suite:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: [self-hosted, oasr-gpu]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.suites) }}
    steps:
      # CUTLASS lives in the 3rdparty/cutlass submodule and every GEMM / BMM /
      # Conv2D kernel is JIT-compiled against its headers, so a checkout without
      # it either fails to compile or -- worse, on a persistent runner -- picks
      # up whatever CUTLASS version was left in the workspace.  The pinned
      # commit is the one the JIT cache key stamps.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # actions/checkout runs `git clean -ffdx`, which deletes every gitignored
      # build output -- oasr/_C*.so and oasr/_core*.so with the rest -- so each
      # job builds them again.  Without a build, the tests gated on `_C` skip
      # (fatally under $STRICT, now that tests/assets.py declares it as OASR_C)
      # and engine tests that reach the C++ beam read-back or alignment pass
      # fail for a reason that is not the code's.  --no-build-isolation because
      # setup.py imports torch to find its CMake prefix (as ci/modal_app.py
      # builds); --no-deps so the runner's CUDA torch is never re-resolved.  The
      # cargo target dir lives outside the workspace so the clean keeps the Rust
      # build.
      - name: Build the extensions
        run: |
          python -m pip install "setuptools>=61.0" wheel "cmake>=3.18" "pybind11>=2.10" ninja \
            "setuptools-rust>=1.10"
          CARGO_TARGET_DIR="$HOME/.cache/oasr/ci-cargo-target" \
            python -m pip install --no-deps --no-build-isolation -e .

      # Fail here, once, rather than as a skip or an error in every test.
      - name: Check the extensions import
        run: python -c "import oasr._C, oasr._core"

      - name: Report the environment
        run: |
          nvidia-smi
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: pytest (${{ matrix.name }})
        run: |
          python -m pytest ${{ matrix.paths }} \
            -m "not slow and not concurrent" \
            -q -rs $STRICT ${{ github.event.inputs.pytest_args }}

  # The opt-in markers, run once rather than per family.
  slow-and-concurrent:
    name: slow + concurrent
    runs-on: [self-hosted, oasr-gpu]
    steps:
      # submodules: 3rdparty/cutlass, as above.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The build and the import check, as in the suite job above.
      - name: Build the extensions
        run: |
          python -m pip install "setuptools>=61.0" wheel "cmake>=3.18" "pybind11>=2.10" ninja \
            "setuptools-rust>=1.10"
          CARGO_TARGET_DIR="$HOME/.cache/oasr/ci-cargo-target" \
            python -m pip install --no-deps --no-build-isolation -e .
      - name: Check the extensions import
        run: python -c "import oasr._C, oasr._core"
      - name: pytest -m slow
        run: python -m pytest tests/ -m "slow" -q -rs $STRICT
      - name: pytest -m concurrent
        run: python -m pytest tests/engine/test_concurrent.py -m concurrent -q -rs $STRICT

  # Everything at once, to catch cross-file state the split matrix would hide
  # (JIT cache collisions, CUDA-graph pool reuse, leaked engines).
  full:
    name: full suite
    runs-on: [self-hosted, oasr-gpu]
    steps:
      # submodules: 3rdparty/cutlass, as above.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The build and the import check, as in the suite job above.
      - name: Build the extensions
        run: |
          python -m pip install "setuptools>=61.0" wheel "cmake>=3.18" "pybind11>=2.10" ninja \
            "setuptools-rust>=1.10"
          CARGO_TARGET_DIR="$HOME/.cache/oasr/ci-cargo-target" \
            python -m pip install --no-deps --no-build-isolation -e .
      - name: Check the extensions import
        run: python -c "import oasr._C, oasr._core"
      - name: pytest tests/
        run: |
          python -m pytest tests/ \
            -m "not slow and not concurrent" \
            -q -rs $STRICT ${{ github.event.inputs.pytest_args }}
