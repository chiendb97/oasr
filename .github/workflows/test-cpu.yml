name: test-cpu

# The fast feedback loop: the part of the suite that runs with no GPU.
#
# Nothing is built.  `oasr/_C*.so` (CMake + CUDA) and `oasr/_core*.so`
# (setuptools-rust) are both absent here, and `import oasr` works without them
# because the CUDA kernels JIT on first *call* and `_C` is loaded lazily.  So
# the job puts the repo on PYTHONPATH and runs pytest directly; a full
# `pip install -e .` would need the CUDA toolkit for a job that cannot use it.
#
# 3.10 is in the matrix because pyproject declares `requires-python = ">=3.10"`
# — a floor nobody tests is a guess.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-cpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime + test dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          # Runtime deps from pyproject [project.dependencies], plus the optional
          # extras whose absence would otherwise turn tests into importorskips.
          pip install numpy "apache-tvm-ffi>=0.1.0" "jinja2>=3.0" "PyYAML>=5.4"
          pip install safetensors huggingface_hub sentencepiece tokenizers transformers soundfile
          pip install -r requirements-dev.txt

      - name: Show what will and will not be covered
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ --collect-only -q | tail -5

      # --min-passed is a coverage floor, not a target: it fails the job if a
      # bad CUDA guard or a silent import failure shrinks the CPU surface.
      # Raise it to just under the observed count after a green run; do not
      # lower it to make a red run pass.
      - name: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ \
            -m "not slow and not concurrent" \
            -q -rs --min-passed 600
