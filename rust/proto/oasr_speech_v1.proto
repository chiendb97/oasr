//
// Google-STT-shaped API in the `oasr.speech.v1` namespace; clients must generate
// bindings from this schema. There is no asynchronous operation RPC.
//
// Extensions add priority, per-request decoding controls, raw tokens, request
// ids, result end time, and finish reason. N-best, word timing and voice
// activity requests are honored or explicitly rejected when unsupported.
// Several source-compatible fields are accepted but ignored.
//
// Supported audio: LINEAR16/32F, MULAW, ALAW, FLAC, MP3, WAV, M4A, AIFF, and
// AUTO. AMR, SPEEX, and Opus variants return `UNIMPLEMENTED`.

syntax = "proto3";

package oasr.speech.v1;

import "google/protobuf/duration.proto";

service Speech {
    // Synchronous unary recognition of a single full audio payload.
    rpc Recognize(RecognizeRequest) returns (RecognizeResponse);

    // Bidirectional streaming recognition.  The first inbound message MUST
    // carry `streaming_config`; subsequent messages carry `audio_content`.
    rpc StreamingRecognize(stream StreamingRecognizeRequest)
        returns (stream StreamingRecognizeResponse);
}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

message RecognitionConfig {
    // Audio encoding.  Values marked "not implemented" return `UNIMPLEMENTED`;
    // they are kept for source-compatibility with Google STT v1.
    enum AudioEncoding {
        ENCODING_UNSPECIFIED = 0;
        LINEAR16             = 1;   // little-endian 16-bit signed PCM (mono)
        FLAC                 = 2;   // FLAC container
        MULAW                = 3;   // ITU-T G.711 µ-law, 1 byte/sample
        AMR                  = 4;   // not implemented
        AMR_WB               = 5;   // not implemented
        OGG_OPUS             = 6;   // not implemented (no pure-Rust Opus decoder)
        SPEEX_WITH_HEADER_BYTE = 7; // not implemented
        MP3                  = 8;   // MPEG audio, bare or ID3-tagged
        WEBM_OPUS            = 9;   // not implemented (no pure-Rust Opus decoder)
        // OASR extensions in the reserved enum range:
        LINEAR32F            = 100; // little-endian 32-bit float PCM (mono)
        WAV                  = 101; // RIFF/WAV container
        ALAW                 = 102; // ITU-T G.711 A-law, 1 byte/sample
        M4A                  = 103; // ISO/MP4 container (AAC or ALAC)
        AIFF                 = 104; // AIFF/AIFC container
        // Sniff the container from the body's own header.  The right choice
        // for a client relaying files it did not create; the named values
        // exist so a *headerless* body can still be described.
        AUTO                 = 105;
    }
    AudioEncoding encoding             = 1;
    uint32        sample_rate_hertz    = 2;
    // BCP-47 primary subtag for families with language control; others reject it.
    string        language_code        = 3;
    uint32        max_alternatives     = 4;  // n-best transcripts (beam decode families)
    // Request word spans on the top alternative; unsupported families reject it.
    bool          enable_word_time_offsets = 8;
    string        model                = 5;  // accepted, ignored (single model per process)
    uint32        audio_channel_count  = 6;  // accepted, ignored (mono only)
    int32         priority             = 100; // OASR extension
    // OASR extensions → per-request DecodingOptions (AR families only).
    uint32        max_new_tokens       = 101; // 0 = engine default
    float         temperature          = 102; // 0 = greedy (default)
    uint32        top_k                = 103; // 0 = disabled
    float         top_p                = 104; // 0 = disabled (i.e. 1.0)
    string        prompt               = 105; // speech-LLM user prompt override
    // "transcribe" or "translate"; empty keeps the checkpoint default.
    string        task                 = 106;
}

// One word span. Confidence is the mean posterior of its tokens and remains
// defined for single-hypothesis decoding.
message WordInfo {
    google.protobuf.Duration start_time = 1;
    google.protobuf.Duration end_time   = 2;
    string                   word       = 3;
    float                    confidence = 4;
}

// ---------------------------------------------------------------------------
// Audio source
// ---------------------------------------------------------------------------

message RecognitionAudio {
    oneof audio_source {
        bytes  content = 1;
        string uri     = 2;  // returns UNIMPLEMENTED
    }
}

// ---------------------------------------------------------------------------
// Results
// ---------------------------------------------------------------------------

message SpeechRecognitionAlternative {
    string          transcript = 1;
    float           confidence = 2;
    // Populated only on the top alternative when word offsets were requested.
    repeated WordInfo words    = 3;
    repeated uint32 tokens     = 100;  // OASR extension: raw CTC token IDs
}

message SpeechRecognitionResult {
    repeated SpeechRecognitionAlternative alternatives    = 1;
    int32                                 channel_tag     = 2;
    google.protobuf.Duration              result_end_time = 4;
    string                                language_code   = 5;

    // "stop" for EOS or "length" for a generation/capacity limit. Empty for
    // one-shot decoding.
    string                                finish_reason   = 101;
}

// ---------------------------------------------------------------------------
// Unary RPC
// ---------------------------------------------------------------------------

message RecognizeRequest {
    RecognitionConfig config = 1;
    RecognitionAudio  audio  = 2;
}

message RecognizeResponse {
    repeated SpeechRecognitionResult results    = 1;
    string                           request_id = 100;  // OASR extension
}

// ---------------------------------------------------------------------------
// Streaming RPC
// ---------------------------------------------------------------------------

// Voice-activity timeouts, in Google v1's shape.
//
// `speech_start_timeout` closes a stream on which speech never began, and is
// *cancelled for the rest of the stream* once the first SPEECH_ACTIVITY_BEGIN
// fires.  `speech_end_timeout` starts on SPEECH_ACTIVITY_END and is reset by a
// new BEGIN.  Both are bounded to [0.5s, 60s]; outside that they are rejected
// rather than clamped.
message VoiceActivityTimeout {
    google.protobuf.Duration speech_start_timeout = 1;
    google.protobuf.Duration speech_end_timeout   = 2;
}

message StreamingRecognitionConfig {
    RecognitionConfig config           = 1;
    // Stop recognizing at the first utterance boundary and emit
    // END_OF_SINGLE_UTTERANCE.  Requires the server to be started with a VAD
    // mode; a request that sets it against an engine without one is rejected
    // rather than silently transcribing to the end of the audio.
    bool              single_utterance = 2;
    bool              interim_results  = 3;
    // Emit SPEECH_ACTIVITY_BEGIN / SPEECH_ACTIVITY_END as they are detected.
    bool              enable_voice_activity_events = 5;
    VoiceActivityTimeout voice_activity_timeout    = 6;
}

message StreamingRecognizeRequest {
    oneof streaming_request {
        StreamingRecognitionConfig streaming_config = 1;
        bytes                      audio_content    = 2;
    }
}

message StreamingRecognitionResult {
    repeated SpeechRecognitionAlternative alternatives    = 1;
    bool                                  is_final        = 2;
    float                                 stability       = 3;
    google.protobuf.Duration              result_end_time = 4;
    string                                language_code   = 6;

    // Final incremental-decode finish reason; empty on interim or one-shot results.
    string                                finish_reason   = 101;
}

enum SpeechEventType {
    SPEECH_EVENT_UNSPECIFIED = 0;
    // The server detected the end of the user's speech utterance.  Emitted only
    // when `single_utterance` is set; the stream stops recognizing after it.
    END_OF_SINGLE_UTTERANCE  = 1;
    // Beginning / end of human voice activity, when
    // `enable_voice_activity_events` is set.
    SPEECH_ACTIVITY_BEGIN    = 2;
    SPEECH_ACTIVITY_END      = 3;
    // A `voice_activity_timeout` expired.
    SPEECH_ACTIVITY_TIMEOUT  = 4;
}

message StreamingRecognizeResponse {
    repeated StreamingRecognitionResult results            = 1;
    SpeechEventType                     speech_event_type  = 2;
    // Audio offset of `speech_event_type`, measured from the bytes received
    // rather than from server wall-clock, so transmission jitter cannot move a
    // reported boundary.
    google.protobuf.Duration            speech_event_offset = 3;
    string                              request_id         = 100;  // OASR extension
}
