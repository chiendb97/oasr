[workspace]
resolver = "2"
members = [
    "crates/oasr-wire",
    "crates/oasr-metrics",
    "crates/oasr-engine-client",
    "crates/oasr-asr",
    "crates/oasr-server-http",
    "crates/oasr-server-grpc",
    "crates/oasr-serve",
    "crates/oasr-server",
    "crates/oasr-core",
]
# `oasr-core` (the `oasr._core` PyO3 extension module) enables
# `pyo3/extension-module`, while `oasr-server` (the standalone binary) enables
# `pyo3/auto-initialize`.  Those two pyo3 features are mutually exclusive, and
# Cargo unifies features across a single build, so `oasr-core` is excluded from
# the default set: a plain `cargo build` produces the binary, while the
# extension module is built on its own by setuptools-rust (see pyproject.toml).
default-members = [
    "crates/oasr-wire",
    "crates/oasr-metrics",
    "crates/oasr-engine-client",
    "crates/oasr-asr",
    "crates/oasr-server-http",
    "crates/oasr-server-grpc",
    "crates/oasr-serve",
    "crates/oasr-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/your-org/oasr"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
# `stream!` — the SSE / delta loops read as straight-line async code with it and
# as a hand-rolled state machine without.
async-stream = "0.3"

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Python embedding — drives the in-process ASREngine dispatcher.  The pyo3
# linkage mode is chosen per consumer, not here: `oasr-server` (binary) turns
# on `pyo3/auto-initialize` to embed + link libpython, while `oasr-core` (the
# `oasr._core` extension module) turns on `pyo3/extension-module` so libpython
# is resolved by the host interpreter at import time.  Those features are
# mutually exclusive, so the workspace dep stays feature-less and the consumers
# opt in via `oasr-engine-client`'s `auto-initialize` / `extension-module`
# features.
pyo3 = { version = "0.22", default-features = false }
numpy = "0.22"

# Concurrent containers / ids
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

# HTTP / gRPC
# `multipart` backs `POST /v1/audio/transcriptions`; `ws` backs the realtime
# endpoint that replaces the FastAPI bridge `examples/web` used to need.
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
# `limit` gives ConcurrencyLimitLayer (bounds how many multi-MiB bodies are
# in flight); tower-http's `timeout` gives the per-request deadline.
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
hyper = { version = "1", features = ["full"] }

# Audio
hound = "3.5"
# Compressed containers/codecs (MP3, FLAC, AAC/M4A, OGG-Vorbis, ALAC, CAF,
# AIFF, MKV/WebM).  Pure Rust — no C library, so it does not change the build
# requirements.  `opt-simd` is dropped: it is nightly-only in symphonia and the
# decode cost is already negligible next to the GPU step.
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# Sinc resampling for client audio that is not at the model's sample rate.
# `default-features = false` drops the optional FFT resampler (and with it the
# realfft / num-complex / rustfft tree) — the async sinc resampler is the only
# one we use.
rubato = { version = "0.16", default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
# The one declaration point for every metric name, kind and bucket set.
oasr-metrics = { path = "crates/oasr-metrics" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
