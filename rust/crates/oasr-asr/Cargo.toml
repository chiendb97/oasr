[package]
name = "oasr-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio decoding (WAV, raw PCM, µ-law/A-law, and compressed codecs) for the OASR Rust frontend."

[features]
# Compressed-container decoding via symphonia.  On by default: users have MP3
# podcasts and M4A voice memos, not headerless PCM.  Turning it off leaves the
# WAV / raw-PCM / µ-law / A-law paths, which need no extra crates.
default = ["codecs"]
codecs = ["dep:symphonia"]

[dependencies]
bytemuck = { workspace = true }
bytes = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
symphonia = { workspace = true, optional = true }
thiserror = { workspace = true }
# `DecodePool`: whole-clip decodes run on the blocking pool behind a semaphore.
tokio = { workspace = true }
tracing = { workspace = true }
