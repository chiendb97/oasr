# Documentation site for OASR, built from docs/ and deployed to GitHub Pages by
# .github/workflows/docs.yml.  The pages are written for GitHub's renderer first;
# scripts/mkdocs_hooks.py adapts the few things that differ on the site.
#
#   pip install -r requirements-docs.txt
#   mkdocs serve            # live preview at http://127.0.0.1:8000
#   mkdocs build --strict   # what CI runs
site_name: OASR
site_description: >-
  OASR is an open-source GPU inference and serving engine for speech recognition:
  Whisper, WeNet Conformer, icefall Zipformer and RNN-T, Nemotron ASR, FunASR
  Paraformer and Qwen2-Audio, offline and streaming, behind an OpenAI-compatible
  API, a realtime WebSocket and gRPC.
site_url: https://chiendb97.github.io/oasr/
site_author: OASR contributors
repo_url: https://github.com/chiendb97/oasr
repo_name: chiendb97/oasr
edit_uri: edit/main/docs/
copyright: Copyright OASR contributors. Licensed under the Apache License 2.0.

docs_dir: docs
hooks:
  - scripts/mkdocs_hooks.py
extra:
  # The home page's <title> (the theme otherwise uses the bare site name).
  home_title: GPU speech recognition inference and serving

theme:
  name: material
  logo: assets/logos/oasr-logo-only.png
  favicon: assets/logos/oasr-logo-only.png
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # The hook sets toc's slugify to GitHub-compatible heading ids, so an anchor
  # that works on GitHub works here.  It is not set in this file because the
  # `!!python/...` tag that would take is rejected by pre-commit's check-yaml.
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

# Each page's own H1 becomes its title; a new page must be added here (CI fails
# on an omitted one), which also lists it in the generated llms.txt.
nav:
  - README.md
  - Getting started:
      - faq.md
      - checkpoints.md
      - benchmarks.md
      - asrbench.md
      - ci.md
  - Architecture and design:
      - architecture.md
      - engine.md
      - scheduler.md
      - models.md
      - decoding.md
      - kernels.md
      - quantization.md
  - Components:
      - features.md
      - vad.md
      - tokenizers.md
      - cache_manager.md
      - ctc_decoder_gpu.md
      - wfst_decoder_gpu.md
      - autotuning.md
  - Operations:
      - serving.md
